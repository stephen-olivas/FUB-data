# Qualification criteria for the weekly FUB funnel report.
#
# Source definition: "RES Early Qualified Definition (WIP - 10/07/26)".
# FUB has no Qualified / Opportunity stages, so each rule looks for evidence in
# whatever FUB data actually carries the signal.
#
# Tuned against discovery 2026-09-07..2026-10-06 (562 leads, all
# "Bonus Website Form", created via API). Things that discovery showed are
# empty in this account and are therefore NOT used: background, appointments,
# deals, event property type.
#
# Matchers available inside `any_of` (a rule fires if ANY one finds evidence):
#   tags:            [..]   tag equals one of these (case-insensitive, exact)
#   sources:         [..]   lead source contains any of these
#   stages:          [..]   stage equals one of these
#   custom_fields:   {customFieldName: [values]}   value contains any; ["*"] = any non-empty value
#   property_types:  [..]   property type on a lead event contains any of these
#   keywords:        [..]   whole-phrase match in text (see search_in)
#   search_in:       [background, fields, notes, texts, events, calls]   (default: all)
#                    "fields" = the person fields listed under text_fields below
#   zip_outside_service_area: true   property / person zip not in service_zip_files
#   has_appointment: true   person has at least one FUB appointment
#   has_deal:        true   person has at least one FUB deal

timezone: America/Los_Angeles

# Leads created in the window are pulled from /people. Trash is included so
# the "created" count is complete; Trash leads count as Unqualified (rule
# `trash` below).
include_trash: true

# Geography tiers. A lead's property zip takes the FIRST tier it matches;
# a zip in none of them is rural / out of area (rule `rural_geo`).
# The report shows the funnel for each tier, plus "core markets overall"
# (res_core + core_metro).
#   res_core    - ReSvcs Zips All Core Markets.xlsx (RES-specific zips in
#                 Phoenix, Atlanta, Las Vegas, Denver, Colorado Springs)
#   core_metro  - rest of those 5 metros + Nashville, from the
#                 "Preferred Zip codes - Bonus" sheet
#   other_metro - every other metro on that sheet
geo_tiers:
  - id: res_core
    label: RES core zips
    files: [data/core_market_zips.csv]
  - id: core_metro
    label: Core market metro (outside RES list)
    files: [data/preferred_zips.csv]
    markets: [Atlanta, Phoenix, Las Vegas, Denver, Colorado Springs, Nashville]
  - id: other_metro
    label: Other preferred metro
    files: [data/preferred_zips.csv]

# Tiers that together make up "core markets overall" in the summary.
core_market_tiers: [res_core, core_metro]

# Person fields scanned as free text by keyword rules (search_in: fields).
text_fields:
  - customNotesRedFlags          # 83% populated
  - customBonusPropertyInfoReport

# Only scan the lead's own (inbound) texts, so a rep's outbound
# "would you like an intro with an agent?" doesn't count as the lead agreeing.
texts_inbound_only: true

enrichment:
  # Per-person endpoints to skip even if a rule could use them.
  # Options: events, notes, texts, calls, appointments, deals
  skip: []

unqualified:
  - id: zillow_active
    label: Already listed / has an agent (active on Zillow)
    # customForSaleOnZillow was "No" on all 562 leads (Sep 7 - Oct 6), so it
    # never fires today; kept so it starts counting if that field gets filled.
    any_of:
      tags: [active listing, has an agent]
      custom_fields:
        customForSaleOnZillow: ["Yes"]
      keywords:
        - already listed
        - currently listed
        - listed on zillow
        - active on zillow
        - zillow agent
        - working with a zillow
        - already have an agent
        - already has an agent
        - have a realtor
      search_in: [fields, notes, texts, calls]

  - id: short_sale_or_foreclosure
    label: Short sale or foreclosure
    # No short-sale / foreclosure tags exist in the account yet.
    any_of:
      tags: []
      custom_fields: {}
      keywords:
        - short sale
        - foreclosure
        - pre-foreclosure
        - preforeclosure
        - notice of default
        - auction date
        - behind on payments
        - behind on my mortgage
      search_in: [fields, notes, texts, calls]

  - id: licensed_agent
    label: Lead is a licensed agent
    any_of:
      tags: []
      custom_fields: {}
      keywords:
        - licensed agent
        - licensed realtor
        - i am a realtor
        - i'm a realtor
        - i am an agent
        - i'm an agent
        - lead is an agent
        - lead is a realtor
        - is a licensed
        - real estate license
      search_in: [fields, notes, texts, calls]

  - id: rural_geo
    label: Rural / unserviceable geography
    any_of:
      tags: [out of service area]
      zip_outside_service_area: true

  - id: specialist_property
    label: Highly unique property needing a specialist
    any_of:
      tags: []
      custom_fields: {}
      keywords:
        - acreage
        - horse property
        - farm land
        - vacant land
        - mobile home
        - manufactured home
        - commercial property
        - mixed use
        - historic home
      search_in: [fields, notes, texts, calls]

  # Last on purpose: a Trash lead that also matches a reason above gets that
  # reason as its primary one; otherwise Trash is the reason.
  - id: trash
    label: Moved to Trash in FUB
    any_of:
      stages: [Trash]

# HAP tags (HAP Soft Qualified / Unqualified) belong to a separate program's
# screening and are intentionally not used here.

# Qualified -> Opportunity: the lead agrees to speak to someone about the
# property ("I would like to intro with an agent"). Any stage at or past the
# agent hand-off counts.
opportunity:
  label: Agreed to speak with an agent
  any_of:
    stages:
      - Referred Out/Appointment Set
      - Appointment Met
      - Signed Seller
      - Signed Buyer
      - Pre Qualified/Showing Homes
      - Under Contract
      - Coming Soon Listing
      - Active Listing
      - Sourcing Cash Offers
      - POP Presented
      - X - Homelight Xfer
      - Closed
    custom_fields:
      customReferralAgent: ["*"]   # a partner agent was assigned
    tags: []
    keywords:
      - intro with an agent
      - intro to an agent
      - introduce me to an agent
      - like to intro
      - speak with an agent
      - speak to an agent
      - talk to an agent
      - talk with an agent
      - meet with an agent
      - connect me with an agent
      - agreed to intro
      - agreed to speak
      - ok to intro
      - okay to intro
    search_in: [notes, texts, calls]
