name: FUB funnel report

on:
  schedule:
    # Mondays 16:05 UTC (~9am Pacific): last complete Mon–Sun week
    - cron: "5 16 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: "report = weekly funnel, discover = field discovery"
        type: choice
        options: [report, discover]
        default: report
      start:
        description: "First day YYYY-MM-DD (blank: last full week for report, last 30 days for discover)"
        required: false
      end:
        description: "Last day YYYY-MM-DD, inclusive (blank: start + 7 days)"
        required: false
      no_activity:
        description: "Report only: skip notes/texts/events (faster, less accurate)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
          FUB_SYSTEM: ${{ secrets.FUB_SYSTEM }}
          FUB_SYSTEM_KEY: ${{ secrets.FUB_SYSTEM_KEY }}
          FUB_APP_URL: ${{ vars.FUB_APP_URL }}
          CMD: ${{ inputs.command || 'report' }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          NO_ACTIVITY: ${{ inputs.no_activity }}
        run: |
          args=("$CMD")
          [ -n "$START" ] && args+=(--start "$START")
          [ -n "$END" ] && args+=(--end "$END")
          [ "$CMD" = "report" ] && [ "$NO_ACTIVITY" = "true" ] && args+=(--no-activity)
          python fub.py "${args[@]}" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fub-${{ inputs.command || 'report' }}-${{ github.run_id }}
          path: output/
          retention-days: 30
